# The normal gate (CLAUDE.md "Test environment"), run by GitHub on every PR into main or a module-* branch
# and on every push to them. Public repo: standard runners are free.
# Owner ruling 2026-11-20: the same checks, split into parallel jobs (one runner each) to cut the wait.
# The required check stays named `gate`: the last job, green only when every other job succeeded.
name: gate

on:
  pull_request:
    branches: [main, 'module-*']
  push:
    branches: [main, 'module-*', 'build/**', 'lane-05a*/**']   # 05a: build/05a and its cloud lanes (owner 2026-11-23, no PRs)
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  TMPDIR: /dev/shm
  TZ: Asia/Karachi              # same as the owner's machine and the restaurant; some tests compare local offsets
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: typecheck + lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6          # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every workspace test project is covered by a test job below
        run: |
          found=$(for d in apps/* packages/*; do [ "$d" = apps/tablet ] && continue; [ -f "$d/package.json" ] && node -p "require('./$d/package.json').name"; done | sort | tr '\n' ' ')
          want="@pos/client @pos/cloud @pos/domain @pos/engine @pos/events @pos/hub "
          [ "$found" = "$want" ] || { echo "workspace projects changed: '$found' vs '$want' — update gate.yml"; exit 1; }
      - run: pnpm -w typecheck
      - run: pnpm -w lint

  test-hub:
    name: test hub (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pos/client build
      - run: pnpm exec vitest run --project @pos/hub --shard=${{ matrix.shard }}

  test-cloud:
    name: test cloud
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U pos -d pos_test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://pos:pos@127.0.0.1:5433/pos_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Postgres test-only settings (CLAUDE.md, same as pos-pg-test)
        run: >-
          psql "$DATABASE_URL"
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"
      - run: pnpm --filter @pos/client build
      - run: pnpm exec vitest run --project @pos/cloud

  test-client-packages:
    name: test client + packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pos/client build
      - run: pnpm exec vitest run --project @pos/client --project @pos/domain --project @pos/engine --project @pos/events

  # Owner ruling 2026-11-24 #4: browser e2e on every gate run — the takeaway specs plus one smoke spec per screen
  # (sign-in, dine-in map, parking, bill, Pass, kitchen screen, hub admin) and the Tier 1 dry-run journeys (t1-*, minus
  # the @gap rows awaiting another lane's fix), on the kiosk and the landscape tablet in
  # parallel (~8–9 min each with T1, measured 2026-11-27: kiosk 8.4, tablet 8.1; day close 8 s). The full five-project suite stays a local / pre-merge run (docs/plans/e2e-baseline.md).
  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [kiosk, tablet-landscape]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright's Chromium (the build apps/client's @playwright/test pins)
        run: pnpm --filter @pos/client exec playwright install --with-deps chromium
      - run: pnpm --filter @pos/client build
      - name: Takeaway specs + one smoke spec per screen
        working-directory: apps/client
        run: >-
          pnpm exec playwright test --project ${{ matrix.project }} --trace off
          e2e/02b-takeaway.spec.ts e2e/02b-queue.spec.ts e2e/02b-tk-flows.spec.ts e2e/02b-tk-handover.spec.ts
          e2e/02b-tk-shell.spec.ts e2e/02b-tk-tiles.spec.ts
          e2e/smoke.spec.ts e2e/02a-map.spec.ts e2e/02b-parking.spec.ts e2e/02b-bill.spec.ts
          e2e/03b-pass.spec.ts e2e/03b-kds.spec.ts e2e/03b-admin.spec.ts
          e2e/t1-takeaway.spec.ts e2e/t1-unpaid.spec.ts e2e/t1-bills.spec.ts e2e/t1-ops.spec.ts e2e/t1-pass.spec.ts
          --grep-invert @gap
      # L-E2E-T1 rows #26 / #27: the day close journey closes the business day, so it runs on a hub of its own
      - name: Day close journey (own hub)
        if: matrix.project == 'kiosk'
        working-directory: apps/client
        run: pnpm exec playwright test -c playwright.dayclose.config.ts --trace off
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            /dev/shm/pos-client-e2e-results
            /dev/shm/pos-client-e2e-dayclose-results
          retention-days: 7

  # The required status check. `always()` + the result test: a skipped or cancelled job is never read as green.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [checks, test-hub, test-cloud, test-client-packages, e2e]
    steps:
      - name: Every gate job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ needs.checks.result }}" = success ] && [ "${{ needs.test-hub.result }}" = success ] \
            && [ "${{ needs.test-cloud.result }}" = success ] && [ "${{ needs.test-client-packages.result }}" = success ] \
            && [ "${{ needs.e2e.result }}" = success ]
