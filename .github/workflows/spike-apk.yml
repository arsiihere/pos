# [spike lock-alerts] Throwaway: builds the spike debug APK on GitHub's runner (the dev box has no Android SDK).
# Runs only for the spike branch; deleted with it.
name: spike-apk
on:
  push:
    branches: [spike/lock-alerts]
    paths: ['spike/lock-alerts/app/**', '.github/workflows/spike-apk.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spike/lock-alerts/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Capacitor (pinned via package-lock)
        run: npm ci --no-audit --no-fund
      - name: Sync web assets into the Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: spike/lock-alerts/app/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Name the APK with the commit
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "pos-spike-alerts-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: pos-spike-alerts-apk
          path: spike/lock-alerts/app/pos-spike-alerts-*.apk
          retention-days: 30
