<x-dc>
<helmet>

body{margin:0}

<div class="pos-root pos-page" lang="en" data-theme="light" dir="ltr" style="width: 390px; min-height: 844px;  position: relative;">
<header class="pos-appbar pos-appbar--phone"><a class="pos-btn" href="#" aria-label="Back"><svg class="pos-icon pos-icon--flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><h1 class="pos-appbar__title" style="flex: 1;">Gulberg settings</h1><div class="pos-appbar__end"></div></header><main class="pos-content" style="padding: 12px 16px; gap: 12px;"><section class="pos-section" style="max-width: 820px;"><div class="pos-section__head"><h2>Tax</h2><p>When off, bills at this branch show no tax, whatever the item’s tax rate. Off until you turn it on.</p></div><button class="pos-switch" role="switch" aria-checked="false" style="color: var(--ink);"><span class="pos-switch__track"></span>Charge tax at this branch</button></section><section class="pos-section" style="max-width: 820px;"><div class="pos-section__head"><h2>Business day</h2></div><label class="pos-field"><span class="pos-field__label">Warn when a business day has been open longer than</span><span class="pos-input-affix" style="max-width: 240px;"><input class="pos-input pos-input--mono" value="16" inputmode="numeric"><span>hours</span></span><span class="pos-field__help">The stock page asks to close yesterday’s day. 1 to 48 hours.</span></label><label class="pos-field"><span class="pos-field__label">Ignore a second “Start day” within</span><span class="pos-input-affix" style="max-width: 240px;"><input class="pos-input pos-input--mono" value="4" inputmode="numeric"><span>hours</span></span><span class="pos-field__help">Stops a day being started twice by two tablets. 0 to 12 hours. Must be less than the hours above.</span></label></section></main><footer class="pos-actionbar" style="padding: 12px 16px; flex-wrap: nowrap;"><button class="pos-btn pos-btn--primary pos-btn--lg pos-btn--block">Save settings</button></footer>
</div>
