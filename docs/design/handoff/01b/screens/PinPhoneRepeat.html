<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hand the phone over</title>
<link rel="stylesheet" href="ds/pos/tokens.css">
<link rel="stylesheet" href="ds/pos/components/bundle.css">
<link rel="stylesheet" href="kit-additions.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="pos-root pos-page" lang="en" data-theme="light" dir="ltr" style="width: 390px; min-height: 844px;  position: relative;">
<header class="pos-appbar pos-appbar--phone"><a class="pos-btn" href="#" aria-label="Back"><svg class="pos-icon pos-icon--flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><h1 class="pos-appbar__title" style="flex: 1;">New PIN for Bilal</h1><div class="pos-appbar__end"></div></header><main class="pos-content" style="padding: 12px 16px; gap: 12px;"><div class="pos-banner pos-banner--info" role="status"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg><p>Hand the phone to Bilal.<small>They type their new PIN twice. You won’t see it.</small></p></div><div style="display: flex; flex-direction: column; align-items: center; gap: 12px;"><span class="caption" style="color: var(--ink-muted);">Step 2 of 2</span><p class="label" style="margin: 0;">Type it again</p><div class="pos-pin" aria-label="PIN"><div class="pos-pin__dots" aria-label="4 digits typed"><span class="pos-pin__dot is-filled"></span><span class="pos-pin__dot is-filled"></span><span class="pos-pin__dot is-filled"></span><span class="pos-pin__dot is-filled"></span></div><div class="pos-pin__keys"><button class="pos-pin__key">1</button><button class="pos-pin__key">2</button><button class="pos-pin__key">3</button><button class="pos-pin__key">4</button><button class="pos-pin__key">5</button><button class="pos-pin__key">6</button><button class="pos-pin__key">7</button><button class="pos-pin__key">8</button><button class="pos-pin__key">9</button><button class="pos-pin__key pos-pin__key--fn">Delete</button><button class="pos-pin__key">0</button><button class="pos-pin__key pos-pin__key--fn">Save</button></div></div></div><p class="caption" style="margin: 0; color: var(--ink-muted);">Saving signs them out on every device.</p></main>
</div>
</x-dc>
</body>
</html>
