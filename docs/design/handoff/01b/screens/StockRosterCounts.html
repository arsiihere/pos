<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stock sign-in</title>
<link rel="stylesheet" href="ds/pos/tokens.css">
<link rel="stylesheet" href="ds/pos/components/bundle.css">
<link rel="stylesheet" href="kit-additions.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="pos-root pos-page" lang="en" data-theme="light" dir="ltr" style="width: 1280px; min-height: 800px;  position: relative;">
<header class="pos-appbar"><h1 class="pos-appbar__title">Stock</h1><span class="pos-chip"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>Sign in to count stock</span></header>
<main class="pos-content" style="gap: 16px; padding: 32px 48px;"><h2 class="title" style="margin: 0;">Who is counting?</h2>
<div class="pos-staff" style="grid-template-columns: repeat(4, minmax(0, 1fr));"><button class="pos-staff__tile">Imran<small>Manager</small></button><button class="pos-staff__tile">Hamza<small>Shift lead</small></button><button class="pos-staff__tile">Usman<small>Counts stock</small></button><button class="pos-staff__tile">Arif<small>Owner</small></button></div>
<p class="caption" style="margin: 0; color: var(--ink-muted);">People with the stock-counting job show “Counts stock”. People without a PIN never appear here.</p></main>
</div>
</x-dc>
</body>
</html>
