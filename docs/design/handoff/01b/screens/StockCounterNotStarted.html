<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stock page</title>
<link rel="stylesheet" href="ds/pos/tokens.css">
<link rel="stylesheet" href="ds/pos/components/bundle.css">
<link rel="stylesheet" href="kit-additions.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="pos-root pos-page" lang="en" data-theme="light" dir="ltr" style="width: 1280px; min-height: 800px;  position: relative;">
<header class="pos-appbar"><h1 class="pos-appbar__title">Stock</h1><span class="pos-chip pos-chip--warn"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>Day not started</span><span class="pos-chip pos-chip--accent"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 11h6"/><path d="M9 15h4"/></svg>Your stations: Degh, Karahi counter, BBQ grill</span>
<div class="pos-appbar__end"><span class="body" style="color: var(--ink-muted);">Usman</span><button class="pos-btn"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h5v16h-5"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/></svg>Sign out</button></div></header><main class="pos-screen pos-screen--warn" style="flex: 1;"><div class="pos-screen__icon"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></div><h1 class="pos-screen__title">The day hasn’t been started</h1><p class="pos-screen__body">Ask someone who can start the day, like Imran. Your stations’ items show here once it is open.</p></main>
</div>
</x-dc>
</body>
</html>
