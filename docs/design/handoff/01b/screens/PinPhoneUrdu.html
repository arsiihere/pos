<body>
<x-dc>
<helmet>
<style>
body{margin:0}

<div class="pos-root pos-page" lang="ur" data-theme="light" dir="rtl" style="width: 390px; min-height: 844px;  position: relative;">
<header class="pos-appbar pos-appbar--phone"><a class="pos-btn" href="#" aria-label="واپس"><svg class="pos-icon pos-icon--flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><h1 class="pos-appbar__title" style="flex: 1;">بلال کا نیا پن</h1><div class="pos-appbar__end"></div></header><main class="pos-content" style="padding: 12px 16px; gap: 12px;"><div class="pos-banner pos-banner--info" role="status"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg><p>فون بلال کو دیں۔<small>وہ نیا پن دو بار لکھیں گے۔ آپ کو نظر نہیں آئے گا۔</small></p></div><div style="display: flex; flex-direction: column; align-items: center; gap: 12px;"><span class="ur-body" style="color: var(--ink-muted);">مرحلہ 1 از 2</span><p class="ur-body" style="margin: 0;">نیا پن لکھیں</p><div class="pos-pin" aria-label="PIN"><div class="pos-pin__dots" aria-label="2 digits typed"><span class="pos-pin__dot is-filled"></span><span class="pos-pin__dot is-filled"></span><span class="pos-pin__dot"></span><span class="pos-pin__dot"></span></div><div class="pos-pin__keys"><button class="pos-pin__key">1</button><button class="pos-pin__key">2</button><button class="pos-pin__key">3</button><button class="pos-pin__key">4</button><button class="pos-pin__key">5</button><button class="pos-pin__key">6</button><button class="pos-pin__key">7</button><button class="pos-pin__key">8</button><button class="pos-pin__key">9</button><button class="pos-pin__key pos-pin__key--fn" style="font-family: var(--font-urdu);">مٹائیں</button><button class="pos-pin__key">0</button><button class="pos-pin__key pos-pin__key--fn" style="font-family: var(--font-urdu);">آگے</button></div></div></div><p class="ur-body" style="margin: 0; color: var(--ink-muted);">محفوظ کرنے سے وہ ہر ڈیوائس سے سائن آؤٹ ہو جائیں گے۔</p></main>
</div>
</x-dc>

</html>
