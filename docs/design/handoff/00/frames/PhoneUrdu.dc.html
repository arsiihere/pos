<div style="display: flex; flex-direction: column; gap: 8px;"><p class="ur-body" style="margin: 0; color: var(--ink-muted);">ریسٹورنٹ POS</p><h1 class="ur-title" style="margin: 0;">یہ فون جوڑیں</h1><p class="ur-body" style="margin: 0; color: var(--ink-muted);">آپ کے مینیجر نے یہ لنک صرف آپ کے لیے بنایا ہے۔ فون کو ایسا نام دیں جو مینیجر پہچان لے۔</p></div>
