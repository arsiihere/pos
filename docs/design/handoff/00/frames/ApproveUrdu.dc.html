<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<title>اسکرین منظور کریں</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pos/tokens.css">
<link rel="stylesheet" href="ds/pos/components/bundle.css">
<link rel="stylesheet" href="kit-additions.css">

<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="pos-root pos-page" lang="ur" data-theme="light" dir="rtl" style="width: 1280px; height: 800px; overflow: hidden;">
<header class="pos-appbar"><a class="pos-btn" href="#"><svg class="pos-icon pos-icon--flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>ہب ایڈمن</a><h1 class="pos-appbar__title">اسکرین منظور کریں</h1><div class="pos-appbar__end"><span class="ur-body" style="color: var(--ink-muted);">عمران</span></div></header>
<main class="pos-content" style="display: grid; grid-template-columns: minmax(0, 620px) 360px; gap: 32px; justify-content: center; align-items: start; padding-top: 24px;">
<section class="pos-card"><div style="display: flex; flex-direction: column; gap: 24px;"><div class="pos-row"><span class="pos-chip pos-chip--ok"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>اسکین کیے گئے QR سے</span></div>
<label class="pos-field"><span class="pos-field__label">اسکرین پر لکھا کوڈ</span><input class="pos-input pos-input--code" value="7KQ2XD" maxlength="6"><span class="pos-field__help"><span class="pos-ltr">6</span> حروف اور ہندسے، نئی اسکرین پر بڑے لکھے ہیں۔</span></label>
<div class="pos-field"><span class="pos-field__label">یہ کون سی اسکرین ہے؟</span><div class="pos-seg pos-seg--block" role="group" aria-label="یہ کون سی اسکرین ہے؟"><button class="pos-seg__opt" aria-pressed="false"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>کیشیئر اسکرین</button><button class="pos-seg__opt" aria-pressed="true"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-4 0-6.5-2.6-6.5-6.2 0-3.6 2.8-5.6 4-8.8 2.2 1.4 2.8 3.6 2.6 5.4 1.2-.4 2-1.6 2.2-3 2 1.8 2.2 4.2 2.2 6.4C16.5 18.4 15 21 12 21z"/></svg>کچن اسکرین</button></div></div>
<div class="pos-field"><span class="pos-field__label">کون سا اسٹیشن؟</span><div class="pos-tiles" role="group" aria-label="کون سا اسٹیشن؟" style="grid-template-columns: repeat(3, minmax(0, 1fr));"><button class="pos-tile" aria-pressed="true">تندور<small>نان، روٹی، کلچہ</small></button><button class="pos-tile" aria-pressed="false">کڑاہی کاؤنٹر<small>کڑاہی فی کلو، ہانڈی</small></button><button class="pos-tile" aria-pressed="false">دیگ<small>پائے، نہاری، چنے</small></button></div></div>
<button class="pos-btn pos-btn--primary pos-btn--lg pos-btn--block"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>منظور کریں</button></div></section>
<aside class="pos-card" style="display: flex; flex-direction: column; gap: 12px;"><span class="ur-body" style="color: var(--ink-muted);">نئی اسکرین یوں کھلے گی</span><div class="pos-explain"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-4 0-6.5-2.6-6.5-6.2 0-3.6 2.8-5.6 4-8.8 2.2 1.4 2.8 3.6 2.6 5.4 1.2-.4 2-1.6 2.2-3 2 1.8 2.2 4.2 2.2 6.4C16.5 18.4 15 21 12 21z"/></svg><span class="ur-title">کچن اسکرین · تندور</span></div><p class="ur-body" style="margin: 0; color: var(--ink-muted);">یہ اسٹیشن کا منظر کھولے گی اور نئی ٹکٹیں دکھائے گی۔</p></aside></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>

}
</script>
</body>
</html>
