<div class="pos-root pos-page" lang="en" data-theme="light" dir="ltr" style="width: 1280px; height: 800px; overflow: hidden;">
<header class="pos-appbar"><a class="pos-btn" href="#" aria-label="Back"><svg class="pos-icon pos-icon--flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Hub admin</a><h1 class="pos-appbar__title">Approve a screen</h1><div class="pos-appbar__end"><span class="body" style="color: var(--ink-muted);">Imran</span></div></header>
<main class="pos-content" style="display: grid; grid-template-columns: minmax(0, 620px) 360px; gap: 32px; justify-content: center; align-items: start; padding-top: 32px;">
<section class="pos-card"><div style="display: flex; flex-direction: column; gap: 24px;"><div class="pos-row"><span class="pos-chip pos-chip--ok"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>From the QR you scanned</span></div><label class="pos-field"><span class="pos-field__label">Code on the screen</span><input class="pos-input pos-input--code" value="7KQ2XD" maxlength="6" autocomplete="off" autocapitalize="characters" aria-describedby="code-help" disabled><span class="pos-field__help">6 letters and digits, shown big on the new screen.</span></label><div class="pos-field"><span class="pos-field__label">What is this screen?</span>
<div class="pos-seg pos-seg--block" role="group" aria-label="What is this screen?">
<button class="pos-seg__opt" aria-pressed="false" disabled><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>Cashier screen</button>
<button class="pos-seg__opt" aria-pressed="true" disabled><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-4 0-6.5-2.6-6.5-6.2 0-3.6 2.8-5.6 4-8.8 2.2 1.4 2.8 3.6 2.6 5.4 1.2-.4 2-1.6 2.2-3 2 1.8 2.2 4.2 2.2 6.4C16.5 18.4 15 21 12 21z"/></svg>Kitchen screen</button></div></div><div class="pos-field"><span class="pos-field__label">Which station?</span><div class="pos-tiles" role="group" aria-label="Which station?" style="grid-template-columns: repeat(3, minmax(0, 1fr));"><button class="pos-tile" aria-pressed="true" disabled>Tandoor<small>Naan, roti, kulcha</small></button><button class="pos-tile" aria-pressed="false" disabled>Karahi counter<small>Karahi by kg, handi</small></button><button class="pos-tile" aria-pressed="false" disabled>Degh<small>Paye, nihari, chanay</small></button></div></div><div class="pos-banner pos-banner--info" role="status"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg><p>You can't add screens.<small>Ask a manager.</small></p></div><button class="pos-btn pos-btn--primary pos-btn--lg pos-btn--block" disabled>Approve</button></div></section><aside class="pos-card" style="display: flex; flex-direction: column; gap: 12px;">
<span class="label" style="color: var(--ink-muted);">The new screen will open as</span>
<div class="pos-explain"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-4 0-6.5-2.6-6.5-6.2 0-3.6 2.8-5.6 4-8.8 2.2 1.4 2.8 3.6 2.6 5.4 1.2-.4 2-1.6 2.2-3 2 1.8 2.2 4.2 2.2 6.4C16.5 18.4 15 21 12 21z"/></svg><span class="heading">Kitchen screen · Tandoor</span></div>
<p class="body" style="margin: 0; color: var(--ink-muted);">It opens the station view and shows new tickets.</p>
<hr style="border: 0; border-top: 1px solid var(--line); margin: 4px 0;">
<p class="caption" style="margin: 0; color: var(--ink-muted);">Approving is recorded with your name.</p></aside></main>
</div>
