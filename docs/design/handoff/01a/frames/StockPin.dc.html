<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stock, PIN sign-in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pos/tokens.css">
<link rel="stylesheet" href="ds/pos/components/bundle.css">
<link rel="stylesheet" href="kit-additions.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="pos-root pos-page" data-theme="light" dir="ltr" style="width: 1280px; height: 800px; overflow: hidden;">
  <header class="pos-appbar">
    <h1 class="pos-appbar__title">Stock</h1>
    <span class="pos-chip"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>Sign in to count stock</span>
  </header>

  <main class="pos-content" style="display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 48px; align-items: start; padding: 40px 64px;">
    <section style="display: flex; flex-direction: column; gap: 16px;">
      <div class="pos-section__head"><h2 style="margin: 0; font: 700 28px/34px var(--font-sans);">Who's signing in?</h2><p style="margin: 0; font: 400 17px/24px var(--font-sans); color: var(--ink-muted);">Tap your name.</p></div>
      <div class="pos-staff" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
        <button class="pos-staff__tile" aria-pressed="true">Imran<small>Manager</small></button>
        <button class="pos-staff__tile">Arif Ahmed<small>Owner</small></button>
        
        <button class="pos-staff__tile is-locked" aria-disabled="true">Bilal<small><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px;"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>Locked · <span class="pos-ltr">12</span> min</small></button>
        <button class="pos-staff__tile">Usman<small>Head cook</small></button>
      </div>
    </section>

    <section class="pos-card" style="display: flex; flex-direction: column; gap: 20px; align-items: center; padding: 32px;">
      <div style="text-align: center;"><p style="margin: 0; font: 400 17px/24px var(--font-sans); color: var(--ink-muted);">PIN for</p><p style="margin: 0; font: 700 26px/32px var(--font-sans);">Imran</p></div>
      <div class="pos-pin">
        <div class="pos-pin__dots"><span class="pos-pin__dot is-filled"></span><span class="pos-pin__dot is-filled"></span><span class="pos-pin__dot"></span><span class="pos-pin__dot"></span></div>
        <div class="pos-pin__keys">
          <button class="pos-pin__key">1</button><button class="pos-pin__key">2</button><button class="pos-pin__key">3</button>
          <button class="pos-pin__key">4</button><button class="pos-pin__key">5</button><button class="pos-pin__key">6</button>
          <button class="pos-pin__key">7</button><button class="pos-pin__key">8</button><button class="pos-pin__key">9</button>
          <button class="pos-pin__key pos-pin__key--fn">Delete</button><button class="pos-pin__key">0</button><button class="pos-pin__key pos-pin__key--fn">Sign in</button>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
