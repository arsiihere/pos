<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stock, phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pos/tokens.css">
<link rel="stylesheet" href="ds/pos/components/bundle.css">
<link rel="stylesheet" href="kit-additions.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="pos-root pos-page" data-theme="light" dir="ltr" style="width: 390px; height: 844px; overflow: hidden;">
  <header class="pos-appbar" style="padding: 12px 16px; min-height: 64px;">
    <h1 class="pos-appbar__title">Stock</h1>
    <div class="pos-appbar__end"><span class="pos-chip pos-chip--ok">Day open · <span class="pos-ltr">09:12</span></span></div>
  </header>

  <main class="pos-content" style="padding: 12px 16px; gap: 12px; overflow: hidden;">
    <div class="pos-seg pos-seg--block" role="group" aria-label="Show">
      <button class="pos-seg__opt" aria-pressed="true" style="padding: 0 8px;">To count <span class="pos-seg__count">18</span></button>
      <button class="pos-seg__opt" aria-pressed="false" style="padding: 0 8px;">Low <span class="pos-seg__count">2</span></button>
      <button class="pos-seg__opt" aria-pressed="false" style="padding: 0 8px;">All</button>
    </div>
    <label class="pos-input-affix">
      <span><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span>
      <input class="pos-input" type="search" placeholder="Find an item" aria-label="Find an item">
    </label>

    <ul class="pos-list pos-list--stack">
      <li class="pos-list__row is-touched">
        <div class="pos-row" style="justify-content: space-between; flex-wrap: nowrap;">
          <div class="pos-list__name"><strong>Chicken Karahi</strong><span>3 kg left · 1.5 kg on orders</span></div>
          <button class="pos-switch" role="switch" aria-checked="true" aria-label="Chicken Karahi on sale"><span class="pos-switch__track"></span></button>
        </div>
        <div class="pos-row" style="flex-wrap: nowrap;">
          <div class="pos-count" style="flex: 1;"><input class="pos-input pos-input--mono" value="4.5" inputmode="decimal" aria-label="Chicken Karahi count in kg" style="width: 100%;"><span class="pos-count__unit">kg</span></div>
          <button class="pos-btn"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>Add</button>
        </div>
      </li>
      <li class="pos-list__row">
        <div class="pos-row" style="justify-content: space-between; flex-wrap: nowrap;">
          <div class="pos-list__name"><strong>Seekh Kebab</strong><span>Not counted today</span></div>
          <button class="pos-switch" role="switch" aria-checked="true" aria-label="Seekh Kebab on sale"><span class="pos-switch__track"></span></button>
        </div>
        <div class="pos-row" style="flex-wrap: nowrap;">
          <div class="pos-count" style="flex: 1;"><input class="pos-input pos-input--mono" value="" placeholder="–" inputmode="numeric" aria-label="Seekh Kebab count in pieces" style="width: 100%;"><span class="pos-count__unit">pcs</span></div>
          <button class="pos-btn"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>Add</button>
        </div>
      </li>
      <li class="pos-list__row is-touched">
        <div class="pos-row" style="justify-content: space-between; flex-wrap: nowrap;">
          <div class="pos-list__name"><strong>Chicken Biryani</strong><span>Same as last night · 12 plates</span></div>
          <button class="pos-switch" role="switch" aria-checked="true" aria-label="Chicken Biryani on sale"><span class="pos-switch__track"></span></button>
        </div>
        <div class="pos-row" style="flex-wrap: nowrap;">
          <div class="pos-count" style="flex: 1;"><input class="pos-input pos-input--mono" value="12" inputmode="numeric" aria-label="Chicken Biryani count in plates" style="width: 100%;"><span class="pos-count__unit">plates</span><button class="pos-count__same" aria-pressed="true" aria-label="Count is still right"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>
          <button class="pos-btn"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>Add</button>
        </div>
      </li>
    </ul>
  </main>

  <footer class="pos-actionbar" style="padding: 12px 16px;">
    <div class="pos-actionbar__info"><strong>12 of 30</strong><span>counted</span></div>
    <div class="pos-actionbar__end"><button class="pos-btn pos-btn--primary">Save 12 counts</button></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
