<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parking order at the car</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pos/tokens.css">
<link rel="stylesheet" href="ds/pos/components/bundle.css">
<link rel="stylesheet" href="kit-additions.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="pos-root pos-page" data-theme="light" dir="ltr" style="width: 390px; height: 844px; overflow: hidden;">
  <header class="pos-appbar" style="padding: 12px 16px; min-height: 64px;">
    <a class="pos-btn" href="#" aria-label="Back"><svg class="pos-icon pos-icon--flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 class="pos-appbar__title">Parking order</h1>
  </header>
  <main class="pos-content" style="padding: 16px; gap: 18px; overflow: hidden;">
    <label class="pos-field"><span class="pos-field__label">Car number</span><input class="pos-input pos-plate pos-plate--input" value="LEB 1234"></label>

    <div class="pos-field"><span class="pos-field__label">Car type</span>
      <div class="pos-tiles pos-tiles--pick" style="grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <button class="pos-tile" aria-pressed="true" style="min-height: 84px;"><svg class="pos-icon pos-icon--xl" viewBox="0 0 24 24" aria-hidden="true" style="width: 36px; height: 36px;"><path d="M2.5 15.5v-2.5l2.5-4h9l4 4h3v2.5"/><circle cx="7" cy="15.5" r="2"/><circle cx="17" cy="15.5" r="2"/></svg>Car</button>
        <button class="pos-tile" style="min-height: 84px;"><svg class="pos-icon pos-icon--xl" viewBox="0 0 24 24" aria-hidden="true" style="width: 36px; height: 36px;"><path d="M3 15.5V12l3-4h7l3 4h4.5v3.5"/><circle cx="7" cy="15.5" r="2"/><circle cx="17" cy="15.5" r="2"/></svg>Small</button>
        <button class="pos-tile" style="min-height: 84px;"><svg class="pos-icon pos-icon--xl" viewBox="0 0 24 24" aria-hidden="true" style="width: 36px; height: 36px;"><path d="M2.5 15.5V8h12l4 4.5h3v3"/><circle cx="7" cy="15.5" r="2"/><circle cx="17" cy="15.5" r="2"/></svg>SUV</button>
        <button class="pos-tile" style="min-height: 84px;"><svg class="pos-icon pos-icon--xl" viewBox="0 0 24 24" aria-hidden="true" style="width: 36px; height: 36px;"><rect x="2.5" y="6.5" width="19" height="9" rx="2"/><circle cx="7" cy="15.5" r="2"/><circle cx="17" cy="15.5" r="2"/></svg>Van</button>
        <button class="pos-tile" style="min-height: 84px;"><svg class="pos-icon pos-icon--xl" viewBox="0 0 24 24" aria-hidden="true" style="width: 36px; height: 36px;"><path d="M2.5 15.5v-3.5h7V8h5l2.5 4h4v3.5"/><circle cx="7" cy="15.5" r="2"/><circle cx="17" cy="15.5" r="2"/></svg>Pickup</button>
        <button class="pos-tile" style="min-height: 84px;"><svg class="pos-icon pos-icon--xl" viewBox="0 0 24 24" aria-hidden="true" style="width: 36px; height: 36px;"><circle cx="5.5" cy="15.5" r="3"/><circle cx="18.5" cy="15.5" r="3"/><path d="M5.5 15.5l4-6h4l5 6"/></svg>Bike</button>
      </div>
    </div>

    <div class="pos-field"><span class="pos-field__label">Colour</span>
      <div class="pos-row" style="gap: 8px;">
        <button class="pos-chip" aria-pressed="true"><span class="pos-swatch pos-swatch--white"></span>White</button>
        <button class="pos-chip"><span class="pos-swatch pos-swatch--black"></span>Black</button>
        <button class="pos-chip"><span class="pos-swatch pos-swatch--silver"></span>Silver</button>
        <button class="pos-chip"><span class="pos-swatch pos-swatch--red"></span>Red</button>
        <button class="pos-chip">More</button>
      </div>
    </div>

    <label class="pos-field"><span class="pos-field__label">Phone (optional)</span><span class="pos-input-affix"><span>+92</span><input class="pos-input pos-input--mono" placeholder="300 1234567" inputmode="tel"></span></label>
  </main>
  <footer class="pos-actionbar" style="padding: 12px 16px;">
    <button class="pos-btn pos-btn--primary pos-btn--lg pos-btn--block">Next: add items</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
