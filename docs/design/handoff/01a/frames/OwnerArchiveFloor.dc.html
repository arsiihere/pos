<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Archive floor</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pos/tokens.css">
<link rel="stylesheet" href="ds/pos/components/bundle.css">
<link rel="stylesheet" href="kit-additions.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="pos-root" data-theme="light" dir="ltr" style="width: 720px; min-height: 560px;  display: grid; place-items: center; background: var(--surface-sunken); padding: 32px; box-sizing: border-box;">
  <div class="pos-dialog pos-dialog--form" role="alertdialog" aria-modal="true" aria-labelledby="a-title">
    <h2 class="pos-dialog__title" id="a-title">Ground floor can't be archived yet</h2>
    <p class="pos-dialog__body">It still has 12 tables in use. Move them to another floor or archive them first.</p>
    <div class="pos-tiles" style="grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;">
      <span class="pos-chip">T1</span><span class="pos-chip">T2</span><span class="pos-chip">T3</span><span class="pos-chip">T4</span><span class="pos-chip">T5</span><span class="pos-chip">T6</span><span class="pos-chip">T7</span><span class="pos-chip">T8</span><span class="pos-chip">T9</span><span class="pos-chip">T10</span><span class="pos-chip">T11</span><span class="pos-chip">T12</span>
    </div>
    <div class="pos-dialog__footer"><button class="pos-btn">Close</button><button class="pos-btn pos-btn--primary">Archive all 12 tables, then the floor</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":560}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
