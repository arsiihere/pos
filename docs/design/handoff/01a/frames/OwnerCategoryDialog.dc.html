<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Category with hours</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pos/tokens.css">
<link rel="stylesheet" href="ds/pos/components/bundle.css">
<link rel="stylesheet" href="kit-additions.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="pos-root" data-theme="light" dir="ltr" style="width: 720px; height: 900px; display: grid; place-items: center; background: var(--surface-sunken); padding: 32px; box-sizing: border-box;">
  <div class="pos-dialog pos-dialog--form" role="dialog" aria-modal="true" aria-labelledby="c-title">
    <h2 class="pos-dialog__title" id="c-title">Edit category</h2>
    <div class="pos-grid">
      <label class="pos-field"><span class="pos-field__label">Category name</span><input class="pos-input" value="Breakfast"></label>
      <label class="pos-field"><span class="pos-field__label">Position</span><input class="pos-input pos-input--mono" value="1" inputmode="numeric"><span class="pos-field__help">1 shows first when ordering.</span></label>
    </div>

    <div class="pos-field"><span class="pos-field__label">When can it be ordered?</span>
      <div class="pos-seg" role="group" aria-label="Hours"><button class="pos-seg__opt" aria-pressed="false">All day</button><button class="pos-seg__opt" aria-pressed="true">Only at set hours</button></div>
    </div>

    <div class="pos-stack" style="gap: 12px;">
      <div class="pos-hours-row">
        <label class="pos-field"><span class="pos-field__label">From</span><input class="pos-input pos-input--mono" type="time" value="07:00"></label>
        <label class="pos-field"><span class="pos-field__label">To</span><input class="pos-input pos-input--mono" type="time" value="13:00"></label>
        <button class="pos-btn" aria-label="Remove 07:00 to 13:00"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>Remove</button>
      </div>
      <div class="pos-hours-row">
        <label class="pos-field"><span class="pos-field__label">From</span><input class="pos-input pos-input--mono" type="time" value="22:00"></label>
        <label class="pos-field"><span class="pos-field__label">To</span><input class="pos-input pos-input--mono" type="time" value="02:00"></label>
        <button class="pos-btn" aria-label="Remove 22:00 to 02:00"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>Remove</button>
      </div>
      <span class="pos-chip pos-chip--info" style="align-self: flex-start;"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/></svg>22:00–02:00 runs past midnight</span>
      <div class="pos-hours-row pos-field--error">
        <label class="pos-field"><span class="pos-field__label">From</span><input class="pos-input pos-input--mono" type="time" value="15:00"></label>
        <label class="pos-field"><span class="pos-field__label">To</span><input class="pos-input pos-input--mono" type="time" value="15:00"></label>
        <button class="pos-btn" aria-label="Remove 15:00 to 15:00"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>Remove</button>
      </div>
      <span class="pos-field__error" style="display: flex;"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5L2.5 20h19L12 3.5z"/><path d="M12 10v4.5"/><path d="M12 17.5v.01"/></svg>From and To must be different.</span>
      <button class="pos-btn" style="align-self: flex-start;"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>Add hours (1 more allowed)</button>
    </div>

    <p style="margin: 0; font: 400 15px/20px var(--font-sans); color: var(--ink-muted);">Every item in Breakfast follows these hours. An item can narrow them further, never widen them.</p>
    <div class="pos-dialog__footer"><button class="pos-btn">Cancel</button><button class="pos-btn pos-btn--primary">Save category</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
