<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stock sign-in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pos/tokens.css">
<link rel="stylesheet" href="ds/pos/components/bundle.css">
<link rel="stylesheet" href="kit-additions.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="pos-root pos-page" lang="en" data-theme="light" dir="ltr" style="width: 1280px; min-height: 800px; ">
<header class="pos-appbar"><h1 class="pos-appbar__title">Stock</h1><span class="pos-chip"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>Sign in to count stock</span></header>
<main class="pos-screen pos-screen--warn" style="flex: 1;"><div class="pos-screen__icon"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true" style="animation: pos-spin 1.6s linear infinite;"><path d="M20 11a8 8 0 0 0-14.3-4.6L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.6L20 16"/><path d="M20 20v-4h-4"/></svg></div><h1 class="pos-screen__title">Can't reach the hub — retrying…</h1><p class="pos-screen__body">The names appear when the hub answers.</p><div class="pos-row" style="justify-content: center;"><button class="pos-btn pos-btn--primary pos-btn--lg"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>Retry now</button></div></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
