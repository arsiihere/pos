<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<title>اسٹاک</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pos/tokens.css">
<link rel="stylesheet" href="ds/pos/components/bundle.css">
<link rel="stylesheet" href="kit-additions.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="pos-root pos-page" lang="ur" data-theme="light" dir="rtl" style="width: 390px; height: 844px; overflow: hidden; font-family: var(--font-urdu);">
  <header class="pos-appbar" style="padding: 12px 16px; min-height: 64px;">
    <h1 class="pos-appbar__title" style="font-family: var(--font-urdu); line-height: 1.9;">اسٹاک</h1>
    <div class="pos-appbar__end"><span class="pos-chip pos-chip--ok" style="font-family: var(--font-urdu);">دن کھلا ہے · <span class="pos-ltr">09:12</span></span></div>
  </header>

  <main class="pos-content" style="padding: 12px 16px; gap: 12px; overflow: hidden;">
    <div class="pos-seg pos-seg--block" role="group" aria-label="دکھائیں">
      <button class="pos-seg__opt" aria-pressed="true" style="padding: 0 8px; font-family: var(--font-urdu);">گننا باقی <span class="pos-seg__count">18</span></button>
      <button class="pos-seg__opt" aria-pressed="false" style="padding: 0 8px; font-family: var(--font-urdu);">کم <span class="pos-seg__count">2</span></button>
      <button class="pos-seg__opt" aria-pressed="false" style="padding: 0 8px; font-family: var(--font-urdu);">سب</button>
    </div>

    <ul class="pos-list pos-list--stack">
      <li class="pos-list__row is-touched">
        <div class="pos-row" style="justify-content: space-between; flex-wrap: nowrap;">
          <div class="pos-list__name"><strong style="font-family: var(--font-urdu); line-height: 1.9;">چکن کڑاہی</strong><span style="font-family: var(--font-urdu); line-height: 2;"><span class="pos-ltr">3</span> کلو باقی</span></div>
          <button class="pos-switch" role="switch" aria-checked="true" aria-label="چکن کڑاہی فروخت میں"><span class="pos-switch__track"></span></button>
        </div>
        <div class="pos-row" style="flex-wrap: nowrap;">
          <div class="pos-count" style="flex: 1;"><input class="pos-input pos-input--mono" value="4.5" inputmode="decimal" aria-label="گنتی کلو میں" style="width: 100%;"><span class="pos-count__unit" style="font-family: var(--font-urdu);">کلو</span></div>
          <button class="pos-btn" style="font-family: var(--font-urdu);">شامل کریں</button>
        </div>
      </li>
      <li class="pos-list__row">
        <div class="pos-row" style="justify-content: space-between; flex-wrap: nowrap;">
          <div class="pos-list__name"><strong style="font-family: var(--font-urdu); line-height: 1.9;">سیخ کباب</strong><span style="font-family: var(--font-urdu); line-height: 2;">آج نہیں گنا</span></div>
          <button class="pos-switch" role="switch" aria-checked="true" aria-label="سیخ کباب فروخت میں"><span class="pos-switch__track"></span></button>
        </div>
        <div class="pos-row" style="flex-wrap: nowrap;">
          <div class="pos-count" style="flex: 1;"><input class="pos-input pos-input--mono" value="" placeholder="–" inputmode="numeric" aria-label="گنتی عدد میں" style="width: 100%;"><span class="pos-count__unit" style="font-family: var(--font-urdu);">عدد</span></div>
          <button class="pos-btn" style="font-family: var(--font-urdu);">شامل کریں</button>
        </div>
      </li>
    </ul>
  </main>

  <footer class="pos-actionbar" style="padding: 12px 16px;">
    <div class="pos-actionbar__info" style="font-family: var(--font-urdu);"><strong style="font-family: var(--font-urdu); line-height: 1.9;"><span class="pos-ltr">30</span> میں سے <span class="pos-ltr">12</span></strong></div>
    <div class="pos-actionbar__end"><button class="pos-btn pos-btn--primary" style="font-family: var(--font-urdu);"><span class="pos-ltr">12</span> گنتیاں محفوظ کریں</button></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
