<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit table</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pos/tokens.css">
<link rel="stylesheet" href="ds/pos/components/bundle.css">
<link rel="stylesheet" href="kit-additions.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="pos-root" data-theme="light" dir="ltr" style="width: 720px; height: 780px; display: grid; place-items: center; background: var(--surface-sunken); padding: 32px; box-sizing: border-box;">
  <div class="pos-dialog pos-dialog--form" role="dialog" aria-modal="true" aria-labelledby="t-title">
    <h2 class="pos-dialog__title" id="t-title">Edit table T7</h2>
    <div class="pos-grid">
      <label class="pos-field"><span class="pos-field__label">Table name</span><input class="pos-input pos-input--mono" value="T7"><span class="pos-field__help">What waiters tap. Short is best.</span></label>
      <label class="pos-field"><span class="pos-field__label">Seats</span><input class="pos-input pos-input--mono" value="6" inputmode="numeric"><span class="pos-field__help">Leave empty if it varies.</span></label>
      <label class="pos-field"><span class="pos-field__label">Floor</span><select class="pos-select"><option>Ground floor</option><option>Family hall</option></select></label>
      <label class="pos-field"><span class="pos-field__label">Position</span><input class="pos-input pos-input--mono" value="7" inputmode="numeric"><span class="pos-field__help">1 shows first on the floor.</span></label>
    </div>
    <div class="pos-dialog__danger">
      <div class="pos-section__head"><strong style="font: 700 17px/22px var(--font-sans);">Archive this table</strong><span style="font: 400 15px/20px var(--font-sans); color: var(--ink-muted);">Waiters can't pick it. An open order on it can still be billed.</span></div>
      <button class="pos-btn pos-btn--danger">Archive</button>
    </div>
    <div class="pos-dialog__footer"><button class="pos-btn">Cancel</button><button class="pos-btn pos-btn--primary">Save table</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":780}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
