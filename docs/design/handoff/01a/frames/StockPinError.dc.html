<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stock, wrong PIN</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pos/tokens.css">
<link rel="stylesheet" href="ds/pos/components/bundle.css">
<link rel="stylesheet" href="kit-additions.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="pos-root pos-page" data-theme="light" dir="ltr" style="width: 1280px; height: 800px; overflow: hidden;">
  <header class="pos-appbar"><h1 class="pos-appbar__title">Stock</h1><span class="pos-chip">Sign in to count stock</span></header>
  <main class="pos-content" style="display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 48px; align-items: start; padding: 40px 64px;">
    <section style="display: flex; flex-direction: column; gap: 16px;">
      <h2 style="margin: 0; font: 700 28px/34px var(--font-sans);">Who's signing in?</h2>
      <div class="pos-staff" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
        <button class="pos-staff__tile" aria-pressed="true">Imran<small>Manager</small></button>
        <button class="pos-staff__tile">Arif Ahmed<small>Owner</small></button>
        <button class="pos-staff__tile is-locked" aria-disabled="true">Bilal<small>Locked · <span class="pos-ltr">12</span> min</small></button>
      </div>
      <div class="pos-banner pos-banner--info"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg><p>Forgot your PIN?<small>The owner can reset it in Restaurant setup.</small></p></div>
    </section>
    <section class="pos-card" style="display: flex; flex-direction: column; gap: 16px; align-items: center; padding: 32px;">
      <p style="margin: 0; font: 700 26px/32px var(--font-sans);">Imran</p>
      <div class="pos-banner pos-banner--danger" role="alert" style="width: 100%;"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5L2.5 20h19L12 3.5z"/><path d="M12 10v4.5"/><path d="M12 17.5v.01"/></svg><p>Wrong PIN<small>2 tries left, then locked for 15 minutes.</small></p></div>
      <div class="pos-pin is-error">
        <div class="pos-pin__dots"><span class="pos-pin__dot"></span><span class="pos-pin__dot"></span><span class="pos-pin__dot"></span><span class="pos-pin__dot"></span></div>
        <div class="pos-pin__keys">
          <button class="pos-pin__key">1</button><button class="pos-pin__key">2</button><button class="pos-pin__key">3</button>
          <button class="pos-pin__key">4</button><button class="pos-pin__key">5</button><button class="pos-pin__key">6</button>
          <button class="pos-pin__key">7</button><button class="pos-pin__key">8</button><button class="pos-pin__key">9</button>
          <button class="pos-pin__key pos-pin__key--fn">Delete</button><button class="pos-pin__key">0</button><button class="pos-pin__key pos-pin__key--fn">Sign in</button>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
