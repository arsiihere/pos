<div class="pos-root pos-page" lang="en" data-theme="light" dir="ltr" style="width: 1280px; height: 800px; overflow: hidden;">
<header class="pos-appbar"><h1 class="pos-appbar__title">Stock</h1><span class="pos-chip pos-chip--ok"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Day open since <span class="pos-ltr">09:12</span></span><span class="pos-chip"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.6L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.6L20 16"/><path d="M20 20v-4h-4"/></svg>Menu up to date</span>
<div class="pos-appbar__end"><span class="body" style="color: var(--ink-muted);">Imran</span><button class="pos-btn">Sign out</button><button class="pos-btn">Close day</button></div></header><main class="pos-content" style="overflow: hidden; gap: 16px;"><div class="pos-banner pos-banner--info" role="status"><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.6L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.6L20 16"/><path d="M20 20v-4h-4"/></svg><p>Chicken Tikka is no longer counted. The list is refreshed.</p></div><div class="pos-row"><label class="pos-input-affix" style="width: 320px;"><span><svg class="pos-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span><input class="pos-input" type="search" value="tikka" aria-label="Find an item"></label></div><ul class="pos-list pos-list--stock"><li class="pos-list__head"><span>Item</span><span>Count now</span><span>Left to sell</span><span>Fresh batch</span><span>Selling</span></li><li class="pos-list__row" style="grid-template-columns: 1fr;"><div class="pos-empty" style="padding: 32px;"><svg class="pos-icon pos-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><h3>No item matches “tikka”</h3><p class="body" style="margin: 0;">Only items counted each morning and items you can switch off are here.</p><button class="pos-btn">Clear search</button></div></li></ul></main>
</div>
</x-dc>
