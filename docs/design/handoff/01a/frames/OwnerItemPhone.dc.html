<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick price change mid-service</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pos/tokens.css">
<link rel="stylesheet" href="ds/pos/components/bundle.css">
<link rel="stylesheet" href="kit-additions.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="pos-root pos-page" lang="en" data-theme="light" dir="ltr" style="width: 390px; min-height: 844px; ">
<header class="pos-appbar pos-appbar--phone"><a class="pos-btn" href="#" aria-label="Back to menu"><svg class="pos-icon pos-icon--flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><h1 class="pos-appbar__title">Naan</h1></header>
<main class="pos-content" style="padding: 16px; gap: 16px; overflow: hidden;">
<section class="pos-card" style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">
<label class="pos-field"><span class="pos-field__label">Price</span><span class="pos-input-affix"><span>Rs</span><input class="pos-input pos-input--mono" value="35" inputmode="decimal"><span>per piece</span></span><span class="pos-field__help">Was Rs 30. Open orders keep the old price.</span></label>
<label class="pos-field"><span class="pos-field__label">Tax</span><select class="pos-select"><option>No tax</option></select></label>
<button class="pos-switch" role="switch" aria-checked="true"><span class="pos-switch__track"></span>On sale at both branches</button></section>
<ul class="pos-list pos-list--stack">
<li class="pos-list__row"><div class="pos-row" style="justify-content: space-between; flex-wrap: nowrap;"><div class="pos-list__name"><strong>Kitchen</strong><span>Tandoor · 4 min · both branches</span></div><button class="pos-btn">Edit</button></div></li>
<li class="pos-list__row"><div class="pos-row" style="justify-content: space-between; flex-wrap: nowrap;"><div class="pos-list__name"><strong>Hours</strong><span>All day</span></div><button class="pos-btn">Edit</button></div></li></ul>
<p class="caption" style="margin: 0; color: var(--ink-muted);">Each branch gets the new price within a minute.</p></main>
<footer class="pos-actionbar" style="padding: 12px 16px;"><div class="pos-actionbar__end" style="width: 100%;"><button class="pos-btn pos-btn--primary pos-btn--lg pos-btn--block">Save price</button></div></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
