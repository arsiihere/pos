<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Phone token</title>
<link rel="stylesheet" href="ds/pos/tokens.css">
<link rel="stylesheet" href="pulse-tk.css">
</head>
<body>
<div class="fr fr--phone " data-theme="light" dir="ltr" lang="en">
<header class="ph-top"><button class="tk-btn tk-btn--chrome" style="min-height:48px"><svg class="ico flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><div class="grow"><b>Token 54</b><small>Due</small></div></header><div class="ph-body"><div class="row"><span class="tk-tv__tok" dir="ltr" style="height:84px;font-size:52px">54</span><div class="tk-tv__who"><b>Takeaway</b><small>Ready by <span class="time" dir="ltr">1:24 PM</span></small></div></div>
<div class="tk-facts" style="grid-template-columns:1fr 1fr"><div class="tk-fact tk-fact--due"><small>Bill</small><b><span class="money" dir="ltr">Rs 1,800</span></b></div><div class="tk-fact"><small>Phone</small><b>—</b></div></div><div class="tk-il"><span class="tk-il__q num">2×</span><div class="tk-il__n"><b>Paye</b><small>From the counter</small></div><span class="tk-chip tk-chip--ok tk-chip--lg"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/><path d="M8 12.5l2.8 2.8L16 10"/></svg>Ready</span></div><div class="tk-il"><span class="tk-il__q num">2×</span><div class="tk-il__n"><b>Lassi · sweet</b><small></small></div><span class="tk-chip tk-chip--warn tk-chip--lg"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16l-1.5 9h-13z"/><path d="M2 10h20"/><path d="M9 6c0-1 1-1 1-2"/><path d="M14 6c0-1 1-1 1-2"/></svg>Cooking</span></div>
<button class="tk-btn tk-btn--lg"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V5a1.5 1.5 0 0 1 3 0v5"/><path d="M10 10V4a1.5 1.5 0 0 1 3 0v6"/><path d="M13 10V5a1.5 1.5 0 0 1 3 0v7"/><path d="M16 12V8a1.5 1.5 0 0 1 3 0v6a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-3-5a1.5 1.5 0 0 1 2.5-1.5L7 14"/></svg>Give ready items now</button><div class="tk-grid2"><button class="tk-btn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>Add items</button><button class="tk-btn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>Remove / cancel</button></div></div>
<div class="ph-bar"><button class="tk-btn tk-btn--xl tk-btn--primary tk-btn--block"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v10H3z"/><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M6 10v.01"/><path d="M18 14v.01"/></svg>Take payment · <span class="money" dir="ltr">Rs 1,800</span></button></div>
</div>
</body>
</html>
