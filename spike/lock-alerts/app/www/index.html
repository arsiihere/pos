<!doctype html>
<!-- [spike lock-alerts] throwaway control page. Not the staff app. -->
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POS spike alerts</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 16px; max-width: 760px; }
    input { width: 100%; padding: 8px; font-size: 16px; box-sizing: border-box; margin: 4px 0 10px; }
    button { padding: 10px 14px; margin: 4px 4px 4px 0; font-size: 15px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    pre { background: #111; color: #9f9; padding: 8px; font-size: 11px; overflow: auto; max-height: 40vh; white-space: pre-wrap; }
    table { border-collapse: collapse; } td { padding: 2px 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
    .ok { color: #0a0; } .bad { color: #c00; }
  </style>
</head>
<body>
  <h2>POS spike — lock-screen alerts</h2>

  <label>Hub URL (e.g. http://192.168.1.10:3000)</label>
  <input id="url" autocomplete="off" />
  <label>Device token (from mint-tablet-token.mjs)</label>
  <input id="token" autocomplete="off" />
  <div class="row">
    <button id="save">Save → native</button>
    <button id="start">Start service</button>
    <button id="stop">Stop service</button>
  </div>

  <h3>Permissions</h3>
  <div class="row">
    <button id="perm-notif">Notification permission</button>
    <button id="perm-battery">Battery-optimisation exemption</button>
    <button id="perm-fsi">Full-screen-intent permission</button>
  </div>

  <h3>Toggles</h3>
  <div class="row">
    <label><input type="checkbox" id="t-wake_lock" style="width:auto"> wake lock</label>
    <label><input type="checkbox" id="t-wifi_lock" style="width:auto"> WifiLock</label>
    <label><input type="checkbox" id="t-urgent_fsi" style="width:auto"> treat all as urgent (FSI)</label>
    <label>ping s <input id="t-ping_s" style="width:70px" type="number" min="0" max="300"></label>
    <button id="apply">Apply (restarts service)</button>
  </div>

  <h3>Status</h3>
  <table id="status"></table>

  <h3>Log tail <button id="clear">Clear log</button></h3>
  <pre id="log"></pre>

<script>
  const P = () => window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AlertService;
  const $ = (id) => document.getElementById(id);
  const say = (e) => alert(String(e && e.message || e));

  $('save').onclick = async () => {
    try { await P().configure({ hubUrl: $('url').value.trim(), deviceToken: $('token').value.trim() }); $('token').value = ''; refresh(); }
    catch (e) { say(e); }
  };
  $('start').onclick = async () => { try { await P().start(); } catch (e) { say(e); } refresh(); };
  $('stop').onclick = async () => { await P().stop(); refresh(); };
  $('perm-notif').onclick = () => P().requestNotificationPermission().then(refresh);
  $('perm-battery').onclick = () => P().requestBatteryExemption();
  $('perm-fsi').onclick = () => P().requestFullScreenIntent();
  $('clear').onclick = () => P().clearLog().then(refresh);
  $('apply').onclick = async () => {
    for (const k of ['wake_lock', 'wifi_lock', 'urgent_fsi']) await P().setToggle({ key: k, value: String($('t-' + k).checked) });
    await P().setToggle({ key: 'ping_s', value: String($('t-ping_s').value || 15) });
    await P().stop(); await P().start(); refresh();
  };

  let togglesLoaded = false;
  async function refresh() {
    if (!P()) { $('status').innerHTML = '<tr><td class="bad">Plugin missing (run inside the app)</td></tr>'; return; }
    const s = await P().status();
    if (!togglesLoaded) {
      for (const k of ['wake_lock', 'wifi_lock', 'urgent_fsi']) $('t-' + k).checked = !!s.toggles[k];
      $('t-ping_s').value = s.toggles.ping_s;
      if (s.hubUrl) $('url').value = s.hubUrl;
      togglesLoaded = true;
    }
    const age = s.lastFrameAt ? Math.round((Date.now() - s.lastFrameAt) / 1000) + ' s ago' : '—';
    const rows = [
      ['service', s.running], ['socket', s.socket], ['last frame', age], ['alerts received', s.alertsReceived],
      ['reconnects', s.reconnects], ['last close', s.lastClose || '—'], ['hub', s.hubUrl || '—'], ['token stored', s.hasToken],
      ['notifications enabled', s.notificationsEnabled], ['battery-opt exempt', s.ignoringBatteryOptimizations],
      ['full-screen intent allowed', s.canUseFullScreenIntent], ['device owner', s.deviceOwner],
      ['device', s.model], ['android', s.android], ['patch', s.patch], ['dedupe keys', s.seenKeys],
    ];
    $('status').innerHTML = rows.map(([k, v]) => {
      const cls = v === true ? 'ok' : v === false ? 'bad' : '';
      return `<tr><td>${k}</td><td class="${cls}">${String(v)}</td></tr>`;
    }).join('');
    const t = await P().logTail({ lines: 40 });
    $('log').textContent = t.lines.slice().reverse().join('\n');
  }
  setInterval(refresh, 2000);
  window.addEventListener('load', refresh);
</script>
</body>
</html>
